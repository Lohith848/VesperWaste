<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vesper Waste</title>
<style>
:root{--bg:#1a140e;--fg:#f3e7d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b08;--fg:#f3e7d3}}
:root[data-theme="dark"]{--bg:#0f0b08;--fg:#f3e7d3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.5 Georgia,'Times New Roman',serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.o{position:fixed;pointer-events:none}
#vg{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.55) 100%)}
.bar{left:0;right:0;background:#000}
#tb{top:0;height:calc(6vh + env(safe-area-inset-top,0px))}
#bb{bottom:0;height:calc(6vh + env(safe-area-inset-bottom,0px))}
#ttl{left:0;right:0;top:36%;text-align:center;animation:f 10s forwards}
#ttl h1{margin:0;font-weight:300;font-size:clamp(20px,6vw,56px);letter-spacing:.55em;text-indent:.55em;text-shadow:0 2px 30px #000}
#ttl p{margin:10px 0 0;font-style:italic;font-size:14px;opacity:.85;text-shadow:0 1px 12px #000}
#hint{left:14px;bottom:calc(7vh + env(safe-area-inset-bottom,0px));max-width:56vw;font-size:12px;text-shadow:0 1px 8px #000;animation:f 18s forwards}
@keyframes f{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
#bt{position:fixed;right:12px;bottom:calc(7vh + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
button{background:rgba(10,8,6,.55);color:var(--fg);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:8px 14px;font:inherit;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#st{width:88px;height:88px;margin:-44px 0 0 -44px;border:1px solid rgba(255,255,255,.4);border-radius:50%;display:none}
#st i{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:rgba(255,255,255,.35)}
</style></head><body>
<canvas id="c"></canvas>
<div class="o" id="vg"></div><div class="o bar" id="tb"></div><div class="o bar" id="bb"></div>
<div class="o" id="ttl"><h1>VESPER WASTE</h1><p>Nothing here asks anything of you.</p></div>
<div class="o" id="hint"></div>
<div class="o" id="st"><i id="kn"></i></div>
<div id="bt"><button id="bm"></button><button id="bc"></button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=i=>document.getElementById(i),L=h=>new T.Color(h).convertSRGBToLinear();
let sd=11;const R=()=>(sd=sd*16807%2147483647)/2147483647;
const hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),f=x-i,g=y-j,u=f*f*(3-2*f),v=g*g*(3-2*g);return(hs(i,j)*(1-u)+hs(i+1,j)*u)*(1-v)+(hs(i,j+1)*(1-u)+hs(i+1,j+1)*u)*v};
const fb=(x,y,o)=>{let a=.5,s=0;for(let i=0;i<o;i++){s+=a*vn(x,y);x=x*2.02+11.3;y=y*2.02+7.9;a*=.5}return s};
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const ad=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a)),cl=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ---------- terrain field ---------- */
const raw=(x,z)=>{
 const n=fb(x*.0007,z*.0007,5),m=fb(x*.0013+40,z*.0013-30,4);
 let h=n*230-100;
 h+=sm(.5,.525,m)*60+sm(.6,.62,m)*70+sm(.68,.7,m)*60;
 h-=(1-sm(0,.045,Math.abs(fb(x*.0011+100,z*.0011+50,3)-.5)))*90*sm(.4,.55,n);
 const w=fb(x*.003+5,z*.003,3)*7,d=1-Math.abs(Math.sin((x*.8+z*.55)*.015+w));
 return h+d*d*16*(1-sm(.55,.7,m))+fb(x*.02,z*.02,3)*5};
const S0=[['wall',0,-330,360,1,0],['zig',620,-760,330,1.2,.2],['tower',-560,-700,170,1.2,0],['ribs',-600,50,320,1,1.2],['gate',560,-130,270,1,.5],['orrery',1080,-60,270,1,0],['spiral',-1050,-500,230,1,0],['mono',80,-1080,210,1,0],['ruins',-300,300,230,1,0],['ruins',1000,330,230,.9,1],['ruins',-1050,450,230,1,2],['zig',800,600,210,.6,2.5],['tower',-700,720,140,.8,0],['ribs',330,470,330,1.3,.3]];
const SS=S0.map(([t,x,z,r,s,ry])=>({t,x,z,r,s,ry,y:Math.max(raw(x,z),-24)}));
const Hs=(x,z)=>{let h=raw(x,z);for(const q of SS){const d=Math.hypot(x-q.x,z-q.z);if(d<q.r*1.4)h+=(q.y-h)*(1-sm(q.r*.75,q.r*1.35,d))}return h};

/* ---------- renderer, light, moods ---------- */
const cv=$('c'),rd=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
rd.setPixelRatio(Math.min(devicePixelRatio,1.5));rd.setSize(innerWidth,innerHeight);
rd.outputEncoding=T.sRGBEncoding;rd.toneMapping=T.ACESFilmicToneMapping;rd.shadowMap.enabled=true;rd.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(58,innerWidth/innerHeight,2,9000);
scene.fog=new T.FogExp2(0,.001);
const hemi=new T.HemisphereLight(0xffffff,0x444444,.5),sun=new T.DirectionalLight(0xffffff,2);
scene.add(hemi,sun,sun.target);
const SMS=innerWidth>900?4096:2048;sun.castShadow=true;sun.shadow.mapSize.set(SMS,SMS);
const sc=sun.shadow.camera;sc.left=sc.bottom=-720;sc.right=sc.top=720;sc.near=10;sc.far=3300;sc.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=2;
const MO=[
{n:'Dawn',top:0x8a97a1,hor:0xe3ad78,sun:0xffc48a,si:2.3,el:10,az:75,fd:.0011,hs:0xffd3a6,hg:0x5b3d2a,hi:.4,ex:.85},
{n:'Noon',top:0x7d9db6,hor:0xe6d9c0,sun:0xfff0d6,si:2.7,el:50,az:35,fd:.0009,hs:0xcfe1f2,hg:0x8c6f52,hi:.55,ex:.78},
{n:'Dusk',top:0x1f2338,hor:0xcf5a2c,sun:0xff7a35,si:1.9,el:3,az:255,fd:.0014,hs:0x6d5d8c,hg:0x2b1914,hi:.35,ex:.95},
{n:'Overcast',top:0x585c60,hor:0xb7b8b4,sun:0xffffff,si:1.2,el:28,az:120,fd:.0016,hs:0xd0d4d8,hg:0x4a4a4a,hi:.7,ex:.9}];
const cur={top:new T.Color(),hor:new T.Color(),sun:new T.Color(),hs:new T.Color(),hg:new T.Color(),si:0,el:0,az:0,fd:0,hi:0,ex:1},tc=new T.Color();
let mood=0,auto=1,yaw=0,pitch=-.05,cy=0,cp=-.05,speed=90,jx=0,jy=0;
const ease=k=>{const m=MO[mood];for(const a of['top','hor','sun','hs','hg'])cur[a].lerp(tc.set(m[a]),k);for(const a of['si','el','az','fd','hi','ex'])cur[a]+=(m[a]-cur[a])*k};

/* ---------- materials: world-space stone / sand detail ---------- */
const NZ='float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}';
const STONE='float a=n3(wP*.02)*.5+n3(wP*.09)*.3+n3(wP*.5)*.2,fl=abs(wN.y),st=sin(wP.y*.3+n3(wP*.03)*7.)*.5+.5,sk=smoothstep(.55,.9,n3(vec3((wP.x+wP.z)*.22,wP.y*.012,0.)));diffuseColor.rgb*=(.5+.9*a)*(.8+.25*st*(1.-fl))*(1.-.45*sk*(1.-fl));';
const SAND='float fl=wN.y,rp=sin(dot(wP.xz,vec2(.9,.45))*.8+n3(wP*.06)*7.)*.5+.5,g=n3(wP*1.6)*.5+n3(wP*.3)*.5;diffuseColor.rgb*=.78+.22*rp*smoothstep(.7,.95,fl)+.35*g;';
const M=(c,o={})=>{const m=new T.MeshStandardMaterial({color:L(c),roughness:o.r||.92,metalness:0,vertexColors:!!o.vc});
m.customProgramCacheKey=()=>o.sand?'s':'r';
m.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 wP,wN;').replace('#include <begin_vertex>','#include <begin_vertex>\nwP=(modelMatrix*vec4(transformed,1.)).xyz;wN=normalize(mat3(modelMatrix)*objectNormal);');
s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 wP,wN;\n'+NZ).replace('#include <color_fragment>','#include <color_fragment>\n{'+(o.sand?SAND:STONE)+'}')};return m};

/* ---------- sky + drifting dust ---------- */
const sky=new T.Mesh(new T.SphereGeometry(4000,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:{uT:{value:new T.Color()},uH:{value:new T.Color()},uS:{value:new T.Color()},uD:{value:new T.Vector3(0,1,0)},uTm:{value:0}},
vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}',
fragmentShader:'uniform vec3 uT,uH,uS,uD;uniform float uTm;varying vec3 vD;'+NZ+'void main(){vec3 d=normalize(vD);float y=max(d.y,0.);vec3 c=mix(uH,uT,pow(y,.55));float s=max(dot(d,uD),0.);c+=uS*(pow(s,1200.)*5.+pow(s,30.)*.4+pow(s,5.)*.14);float k=n3(vec3(d.xz/(y+.3)*1.7,uTm*.012))*.6+n3(vec3(d.xz/(y+.3)*4.,uTm*.02))*.4;c=mix(c,uH*1.1+uS*.08,smoothstep(.5,.85,k)*.45*smoothstep(0.,.3,d.y));gl_FragColor=vec4(c,1.);}'}));
sky.frustumCulled=false;sky.renderOrder=-1;scene.add(sky);
const DN=1400,dp=new Float32Array(DN*3);for(let i=0;i<DN*3;i++)dp[i]=R()*320;
const dgm=new T.BufferGeometry();dgm.setAttribute('position',new T.BufferAttribute(dp,3));
const dust=new T.Points(dgm,new T.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uC:{value:new T.Vector3()},uT:{value:0},uCol:{value:new T.Color()}},
vertexShader:'uniform vec3 uC;uniform float uT;varying float vA;void main(){vec3 p=mod(position-uC+vec3(uT*8.,-uT*1.5,uT*3.),320.)-160.;vec4 mv=viewMatrix*vec4(p+uC,1.);gl_Position=projectionMatrix*mv;vA=smoothstep(160.,60.,length(p));gl_PointSize=clamp(2200./-mv.z,1.,9.);}',
fragmentShader:'uniform vec3 uCol;varying float vA;void main(){float r=length(gl_PointCoord-.5)*2.;gl_FragColor=vec4(uCol,smoothstep(1.,.2,r)*vA*.35);}'}));
dust.frustumCulled=false;scene.add(dust);

/* ---------- terrain ---------- */
const SZ=4600,N=380,tg=new T.PlaneGeometry(SZ,SZ,N,N);tg.rotateX(-Math.PI/2);
const pa=tg.attributes.position;for(let i=0;i<pa.count;i++)pa.setY(i,Hs(pa.getX(i),pa.getZ(i)));
tg.computeVertexNormals();
const na=tg.attributes.normal,ca=new Float32Array(pa.count*3),C=new T.Color(),C2=new T.Color(),sA=L(0xd6a96f),sB=L(0xa57748),rA=L(0x93705a),rB=L(0x5b473b);
for(let i=0;i<pa.count;i++){const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i),k=fb(x*.004,z*.004,3),r=sm(.86,.62,na.getY(i));
C.copy(sB).lerp(sA,cl((k-.3)*2.6,0,1));C2.copy(rB).lerp(rA,.5+.5*Math.sin(y*.28+k*9));C.lerp(C2,r);if(y<-40)C.multiplyScalar(.55);C.toArray(ca,i*3)}
tg.setAttribute('color',new T.BufferAttribute(ca,3));
const ter=new T.Mesh(tg,M(0xffffff,{vc:1,sand:1,r:1}));ter.castShadow=ter.receiveShadow=true;scene.add(ter);
const wa=new T.Mesh(new T.PlaneGeometry(SZ,SZ),new T.MeshStandardMaterial({color:L(0x3b5557),roughness:.08,metalness:.1,transparent:true,opacity:.92}));
wa.rotation.x=-Math.PI/2;wa.position.y=-42;wa.receiveShadow=true;scene.add(wa);

/* ---------- architecture ---------- */
let G;const anim=[];
const SM=[M(0xb99b78),M(0xa88a6c),M(0xc9ae8c),M(0x8f7863)],pk=()=>SM[R()*4|0],DK=new T.MeshStandardMaterial({color:L(0x120f0c),roughness:.7}),BN=M(0xd8ccb5),OB=new T.MeshStandardMaterial({color:L(0x121110),roughness:.3,metalness:.4}),SD=M(0xb09474);SD.side=T.DoubleSide;
const P=(g,x,y,z,rx,ry,rz,m,par)=>{const o=new T.Mesh(g,m||pk());o.position.set(x,y,z);o.rotation.set(rx||0,ry||0,rz||0);o.castShadow=o.receiveShadow=true;(par||G).add(o);return o};
const B=(w,h,d)=>new T.BoxGeometry(w,h,d);
const GEN={
wall:s=>{for(let i=-3;i<=3;i++){const h=(230+R()*170)*s,w=(36+R()*30)*s,d=w*.55,b=P(B(w,h,d),i*95*s,h/2-10,(R()-.5)*18*s,0,(R()-.5)*.1,(R()-.5)*.03);
 for(let k=0;k<6;k++)P(B(w*.07,h*.07,d*1.06),(R()-.5)*w*.55,-h/2+h*(.18+k*.13),0,0,0,0,DK,b)}},
zig:s=>{let y=-8,w=360*s,ro=0;for(let i=0;i<7;i++){const h=(58-i*4)*s,t=P(B(w,h,w),0,y+h/2,0,0,ro);
 if(i<5)for(let k=-2;k<=2;k++)P(B(w*.035,h*.55,w*1.01),k*w*.17,0,0,0,0,0,DK,t);
 y+=h;w*=.78;ro+=.13}
 P(new T.ConeGeometry(16*s,200*s,4),0,y+100*s,0,0,.8);P(B(46*s,64*s,10*s),0,-8+32*s,180*s,0,0,0,DK)},
ribs:s=>{for(let i=0;i<9;i++)P(new T.TorusGeometry((100-Math.abs(i-4)*11)*s,6.5*s,8,44,Math.PI),0,-6,(i-4)*40*s,0,0,(i-4)*.035,BN);
 P(new T.CylinderGeometry(7*s,10*s,360*s,8),0,6*s,0,Math.PI/2,0,0,BN)},
tower:s=>{const h=420*s,r=62*s;P(new T.CylinderGeometry(r,r*1.3,h,44,1,true,0,5.2),0,h/2-10,0,0,R()*6,0,SD);
 for(let i=0;i<7;i++){const f=.06+i*.145;P(new T.TorusGeometry(r*(1.3-.3*f)+3*s,3.5*s,6,44),0,h*f,0,Math.PI/2)}
 P(new T.CylinderGeometry(r*.45,r*.55,h*.7,18),0,h*.35,0)},
gate:s=>{const h=290*s;P(B(62*s,h,74*s),-115*s,h/2-10,0);P(B(62*s,h*.78,74*s),115*s,h*.39-10,0,0,0,.05);
 P(B(190*s,48*s,80*s),-60*s,h+14*s,0,0,0,-.03);P(B(150*s,46*s,78*s),205*s,26*s,60*s,.1,.4,.35)},
orrery:s=>{const y=270*s;P(new T.CylinderGeometry(10*s,24*s,y,6),0,y/2-10,0);P(new T.IcosahedronGeometry(34*s,1),0,y,0,0,0,0,OB);
 for(let i=0;i<5;i++)anim.push([P(new T.TorusGeometry((70+i*38)*s,2.6*s,8,90),0,y,0,R()*3,R()*3,0,BN),.06+i*.025]);
 for(let i=0;i<6;i++){const a=i*1.05;P(B(26*s,26*s,26*s),Math.cos(a)*250*s,y+Math.sin(i*2)*50*s,Math.sin(a)*250*s,R(),R(),R(),OB)}},
spiral:s=>{for(let i=0;i<64;i++){const a=i*.29;P(B(96*s,8*s,28*s),Math.cos(a)*74*s,i*7.4*s,Math.sin(a)*74*s,0,-a)}P(new T.CylinderGeometry(24*s,30*s,500*s,12),0,240*s,0)},
mono:s=>{for(let i=0;i<5;i++){const a=i*1.2566,h=(380+R()*120)*s;P(B(56*s,h,16*s),Math.cos(a)*120*s,h/2-10,Math.sin(a)*120*s,(R()-.5)*.08,-a+Math.PI/2,(R()-.5)*.12,OB)}},
ruins:s=>{for(let i=0;i<30;i++){const a=R()*6.28,d=R()*170*s,x=Math.cos(a)*d,z=Math.sin(a)*d;
 if(R()<.5){const h=(50+R()*110)*s;P(new T.CylinderGeometry(7*s,9*s,h,10),x,h*.3,z,(R()-.5)*1.5,R()*6,(R()-.5)*1.5)}
 else P(B((40+R()*80)*s,(8+R()*34)*s,(10+R()*16)*s),x,6*s,z,(R()-.5)*.6,R()*6,(R()-.5)*.6)}
 for(let i=0;i<3;i++)P(new T.TorusGeometry((50+R()*30)*s,7*s,8,30,Math.PI),(i-1)*130*s,-4,(R()-.5)*60*s,0,R()*.8,0)}};
for(const q of SS){G=new T.Group();G.position.set(q.x,q.y,q.z);G.rotation.y=q.ry;GEN[q.t](q.s);scene.add(G)}

/* ---------- boulders and black-spire forests ---------- */
const Dm=new T.Object3D(),NR=1600,rk=new T.InstancedMesh(new T.IcosahedronGeometry(1,1),new T.MeshStandardMaterial({color:L(0x7a6350),roughness:1,flatShading:true}),NR);
for(let i=0;i<NR;i++){const x=(R()-.5)*3200,z=(R()-.5)*3200,sc2=2+R()*R()*26;Dm.position.set(x,Hs(x,z)+sc2*.1,z);Dm.rotation.set(R()*6,R()*6,R()*6);Dm.scale.set(sc2*(.7+R()*.6),sc2*(.5+R()*.5),sc2*(.7+R()*.6));Dm.updateMatrix();rk.setMatrixAt(i,Dm.matrix)}
rk.castShadow=rk.receiveShadow=true;rk.frustumCulled=false;scene.add(rk);
const cg=new T.ConeGeometry(1,1,7);cg.translate(0,.5,0);
const NT=2400,tr=new T.InstancedMesh(cg,new T.MeshStandardMaterial({color:L(0x2f4339),roughness:.9,flatShading:true}),NT);let tc2=0;
for(let k=0;k<20000&&tc2<NT;k++){const x=(R()-.5)*3000,z=(R()-.5)*3000,y=Hs(x,z);
 if(y>-41&&y<22&&fb(x*.003+9,z*.003,3)>.53&&!SS.some(q=>Math.hypot(x-q.x,z-q.z)<q.r*1.05)){const h=26+R()*60,w=3+R()*5;Dm.position.set(x,y-1,z);Dm.rotation.set(0,R()*6,0);Dm.scale.set(w,h,w);Dm.updateMatrix();tr.setMatrixAt(tc2++,Dm.matrix)}}
tr.count=tc2;tr.castShadow=tr.receiveShadow=true;tr.frustumCulled=false;scene.add(tr);

/* ---------- controls ---------- */
const K={},ptr={},bm=$('bm'),bc=$('bc'),st=$('st'),kn=$('kn');
const lab=()=>{bm.textContent='Mood: '+MO[mood].n;bc.textContent='Cruise: '+(auto?'on':'off')};
const stopAuto=()=>{if(auto){auto=0;yaw=cy;pitch=cp;lab()}};
bm.onclick=()=>{mood=(mood+1)%MO.length;lab()};bc.onclick=()=>{if(auto)stopAuto();else{auto=1;lab()}};
$('hint').textContent=matchMedia('(pointer:coarse)').matches?'Left thumb moves, right thumb looks. Look up while moving to climb.':'W A S D to move. Drag to look. Q and E to descend and rise. Shift goes faster. Scroll changes speed.';
addEventListener('keydown',e=>{K[e.code]=1;if(/^(Key[WASDQEC]|Arrow|Space)/.test(e.code)){stopAuto();e.preventDefault()}});
addEventListener('keyup',e=>{K[e.code]=0});addEventListener('blur',()=>{for(const k in K)K[k]=0});
addEventListener('wheel',e=>{speed=cl(speed*(e.deltaY<0?1.12:.89),20,700)},{passive:true});
cv.addEventListener('pointerdown',e=>{stopAuto();cv.setPointerCapture(e.pointerId);const joy=e.pointerType==='touch'&&e.clientX<innerWidth*.45&&!Object.values(ptr).some(p=>p.joy);
 ptr[e.pointerId]={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,joy};if(joy){st.style.display='block';st.style.left=e.clientX+'px';st.style.top=e.clientY+'px'}});
cv.addEventListener('pointermove',e=>{const p=ptr[e.pointerId];if(!p)return;
 if(p.joy){let dx=(e.clientX-p.sx)/50,dy=(e.clientY-p.sy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}jx=dx;jy=dy;kn.style.transform='translate('+dx*30+'px,'+dy*30+'px)'}
 else{yaw-=(e.clientX-p.x)*.004;pitch=cl(pitch-(e.clientY-p.y)*.004,-1.5,1.5);p.x=e.clientX;p.y=e.clientY}});
